# BetterPMMP – Vanilla-Einstellungen
# Diese Datei wird beim ersten Start im Serverordner angelegt.
# Änderungen werden beim nächsten Serverstart übernommen.

# ---------------------------------------------------------------
# Mob-Spawning in normalen Welten (Oberwelt-Typ)
# ---------------------------------------------------------------
# Nether- und End-Welten verhalten sich IMMER wie Vanilla
# (Mobs, Festungen, Enderdrache) – egal was hier steht.
#
# worlds: Liste der Welt-Ordnernamen, in denen Mobs natürlich spawnen.
#   "*"        = in allen Welten
#   "default"  = nur in der Hauptwelt (level-name aus server.properties)
# Beispiel:  worlds: ["world", "survival"]
mob-spawning:
  worlds: ["default"]
  # Welten, in denen NIE Mobs spawnen (z. B. Lobby, Minispiele)
  disabled-worlds: []    # z. B. ["lobby", "minispiel"]
  monsters: true          # Zombies, Skelette, Creeper, ...
  animals: true           # Kühe, Schafe, Schweine, ...
  ambient: true           # Fledermäuse
  water: true             # Fische, Tintenfische, Delfine
  village-residents: true # Dorfbewohner in generierten Dörfern
  pillagers: true         # Plünderer an Außenposten und Patrouillen
  wardens: true           # Warden aus Sculk-Kreischern im Tiefen Dunkel
  wandering-trader: true  # Fahrender Händler mit Händler-Lamas
  # Vanilla-Limits pro Spieler
  max-monsters-per-player: 70
  max-animals-per-player: 10
  max-ambient-per-player: 15

# ---------------------------------------------------------------
# Mob-KI
# ---------------------------------------------------------------
mob-ai:
  # Millisekunden Wegfindung pro Server-Tick für alle Mobs zusammen
  pathfinding-ms-per-tick: 6

# ---------------------------------------------------------------
# Karten (Fehlersuche)
# ---------------------------------------------------------------
# Wenn Spieler beim Erstellen oder Halten einer Karte rausfliegen:
# nacheinander auf false stellen und testen, welcher Schalter es behebt.
maps:
  send-creation-packet: true  # Paket "Karte erstellt" vor dem ersten Bild
  send-images: true           # Kartenbild (Pixel und Markierungen)

# ---------------------------------------------------------------
# Hände tauschen (jedes Item zwischen Haupthand und Zweithand)
# ---------------------------------------------------------------
# Immer möglich: Befehl /swaphands (auch /swap oder /offhand).
hand-swap:
  double-sneak: true   # zweimal schnell schleichen tauscht die Hände

# ---------------------------------------------------------------
# Java-Bridge (Java-Edition-Spieler auf BetterPMMP)
# ---------------------------------------------------------------
# Läuft automatisch: BetterPMMP lädt beim ersten Start Java 21 (falls keins
# installiert ist) und ViaProxy (github.com/ViaVersion/ViaProxy) in den
# Ordner java-bridge/, startet ViaProxy mit dem Server, startet es nach einem
# Absturz neu und beendet es beim Stoppen.
# Java-Spieler verbinden sich mit <deine-adresse> (Port 25565, Java Edition).
# Der Port muss in Firewall/Router (TCP) offen sein.
# Java-Spieler brauchen kein Xbox-Konto: ViaProxy prüft ihr Mojang-Konto
# (online-mode), ihr Name bekommt das Präfix (z. B. J_Steve).
# Hinweis: Verbindungen von 127.0.0.1 gelten als Java-Bridge, solange sie läuft.
java-bridge:
  enabled: true                     # false = keine Java-Spieler
  port: 25565                       # Java-Port (TCP)
  java-path: "java"                 # eigenes Java, sonst wird es geladen
  auto-download: true               # Java und ViaProxy automatisch laden
  viaproxy-channel: "dev"           # dev = neuester Build (nötig für neue Bedrock-Versionen), stable = nur Releases
  viaproxy-build: "964"             # getesteter Dev-Build (passt zum BetterPMMP-Bridge-Plugin), "latest" = immer der neueste
  online-mode: true                 # nur echte (gekaufte) Java-Konten
  name-prefix: "J_"                 # Namen von Java-Spielern, z. B. J_Steve
  target-version: "Bedrock 1.26.60" # Bedrock-Version für ViaProxy
  memory: "512M"                    # maximaler Arbeitsspeicher für ViaProxy
  resource-pack-port: 25566         # Texture-Packs für Java (TCP freigeben), 0 = aus
  public-address: ""                # Adresse für Java-Clients, leer = öffentliche IP automatisch (z. B. "splashgames.nl")
  chat-forms: false                 # true = Formulare (UIs) für Java-Spieler als Chat-Menü statt Fenster
  real-light: true                  # echtes Licht (Sonne, Fackeln, Höhlen) an Java-Spieler schicken - wichtig für Shader
  build-log: true                   # schreibt jeden Java-Klick beim Bauen ins Log (Fehlersuche), false = aus
  fast-build-fix: true              # false = gesetzte Blöcke wie im Original-ViaBedrock bestätigen (falls schnelles Bauen Probleme macht)
