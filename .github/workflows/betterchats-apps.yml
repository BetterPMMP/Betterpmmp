# Builds the BetterChats apps (they show the BetterChats website in a hardened app window).
# Only runs for changes in betterchats/ – the BetterPMMP code is not touched.
name: BetterChats Apps

on:
  push:
    branches: [claude/laughing-johnson-jl0wh6]
    paths: ['betterchats/apps/**', '.github/workflows/betterchats-apps.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  BETTERCHATS_URL: ${{ vars.BETTERCHATS_URL || 'https://147-189-169-3.sslip.io:30' }}

jobs:
  windows:
    name: Windows (Installer .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node betterchats/apps/prepare.js
      - name: Build installer
        working-directory: betterchats/apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BetterChats-Windows
          path: betterchats/apps/desktop/dist/*.exe
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: node betterchats/apps/prepare.js
      - name: Build APK
        working-directory: betterchats/apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../BetterChats.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BetterChats-Android
          path: betterchats/apps/mobile/BetterChats.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned .ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node betterchats/apps/prepare.js
      - name: Build unsigned IPA
        working-directory: betterchats/apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr BetterChats-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BetterChats-iOS
          path: betterchats/apps/mobile/BetterChats-unsigned.ipa
          if-no-files-found: error
