# Publishes a GitHub release when a version tag (v...) is pushed.
# The tagged commit has to contain release/RELEASE-<version>.md, release/BetterPMMP-<version>.phar
# and release/banner-<version>.png; <version> is the tag without "v" and without "-vanilla-beta.1" etc.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          short="${version%%-*}"
          prerelease=""
          case "$version" in *beta*|*alpha*) prerelease="--prerelease" ;; esac
          gh release create "$tag" \
            "release/BetterPMMP-${short}.phar" \
            "release/banner-${short}.png" \
            --title "BetterPMMP ${version}" \
            --notes-file "release/RELEASE-${short}.md" \
            $prerelease
