#!/usr/sbin/nft -f
# BetterChats firewall (nftables)
#  - everything closed by default, closed ports DROP silently (scanners see "filtered", not "closed")
#  - no ping replies, malformed/scan packets (NULL, XMAS, FIN, SYN+FIN …) dropped
#  - anyone touching a closed port 3x within a minute is banned for 1 hour
#  - SSH and the chat port are rate-limited per IP
# Variables are filled in by install.sh.
#  - chat port: public (rate-limited) or closed (Tor/.onion stealth mode: nmap finds NOTHING)
#  - SSH: open (rate-limited), onion (closed to the world, admin only via Tor) or closed (provider console only)

define SSH_PORT  = __SSH_PORT__
define CHAT_PORT = __CHAT_PORT__

table inet betterchats
delete table inet betterchats

table inet betterchats {
  set ban4 { type ipv4_addr; flags dynamic, timeout; timeout 1h; size 65536; }
  set ban6 { type ipv6_addr; flags dynamic, timeout; timeout 1h; size 65536; }
  set probe4 { type ipv4_addr; flags dynamic, timeout; timeout 1m; size 65536; }
  set probe6 { type ipv6_addr; flags dynamic, timeout; timeout 1m; size 65536; }

  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state invalid drop
    ct state established,related accept

    ip saddr @ban4 drop
    ip6 saddr @ban6 drop

    # stealth scans / malformed TCP flags
    tcp flags & (fin|syn|rst|psh|ack|urg) == 0x0 drop
    tcp flags & (fin|syn|rst|psh|ack|urg) == fin|psh|urg drop
    tcp flags & (fin|syn) == fin|syn drop
    tcp flags & (syn|rst) == syn|rst drop
    tcp flags & (fin|rst) == fin|rst drop
    tcp flags & (fin|ack) == fin drop
    tcp flags syn tcp option maxseg size 1-535 drop

    # IPv6 needs these to work at all; still no echo replies
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big } accept
    icmp type { destination-unreachable, time-exceeded } accept

    __SSH_RULES__

    __CHAT_RULES__

    # other services on this server you chose to keep (e.g. Apache 80/443)
    __EXTRA_RULES__

    # a TCP connection attempt to any closed port is a probe:
    # 1st probe -> remembered for 1 minute, 2nd probe within that minute -> banned for 1 hour
    tcp flags syn ct state new ip saddr @probe4 add @ban4 { ip saddr } drop
    tcp flags syn ct state new ip6 saddr @probe6 add @ban6 { ip6 saddr } drop
    tcp flags syn ct state new meta nfproto ipv4 add @probe4 { ip saddr } drop
    tcp flags syn ct state new meta nfproto ipv6 add @probe6 { ip6 saddr } drop
    drop
  }

  chain forward { type filter hook forward priority filter; policy drop; }
  chain output  { type filter hook output priority filter; policy accept; }
}
