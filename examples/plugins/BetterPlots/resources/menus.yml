  atmosphere:
    title: §b§lBetterPlots §r§8· Wetter & Biome
    description: §7Wetter bestimmt die Atmosphäre. Biome bestimmen Landschaftsfarben und ob Niederschlag als Regen oder Schnee erscheint.
    entries:
    - label: §eWetter auswählen
      icon: water_bucket
      enabled: true
      command:
      - climate
      plot-context: true
      fields:
      - label: Wetter
        default: ''
        options:
        - Sonne
        - Regen
        - Gewitter
        - Schnee (setzt Schneebiom)
        values:
        - sun
        - rain
        - storm
        - snow
      hint: Schnee ändert das Biom. Sonne entfernt keine bereits liegenden Schneeblöcke.
    - label: §bHell oder dunkel
      icon: clock
      enabled: true
      command:
      - flag
      - set
      - time
      plot-context: true
      fields:
