---
version: 5
pages:
  main:
    title: §b§lBetterPlots §r§8· Dein Baubereich
    description: '§7Dein Grundstück, deine Ideen.

      §fWähle einen Bereich. Eingaben folgen als Formular.'
    entries:
    - label: '§aGrundstücke

        §7Besuchen · Beanspruchen · Infos'
      page: plots
      icon: grass
    - label: '§eMitglieder

        §7Vertrauen · Einladen · Sperren'
      page: members
      icon: player_head
    - label: '§bPlot-Einstellungen

        §7PvP · Redstone · Wetter'
      page: settings
      icon: comparator
    - label: '§6Einfach gestalten

        §7Rand · Wand · Wiederherstellen'
      page: build
      icon: diamond_pickaxe
    - label: '§dBackups

        §7Sichern · Laden · Kopieren'
      page: backups
      icon: chest
    - label: '§aCommunity

        §7Kommentare · Bewertungen · Chat'
      page: social
      icon: book
    - label: '§cAdministration

        §7Welten · Vorlagen · Diagnose'
      page: admin
      icon: command_block
      permission: plots.admin.*
  plots:
    title: §b§lBetterPlots §r§8· Grundstücke
    description: Wähle eine Aktion. Änderungen prüfen immer deine Grundstücksrechte.
    entries:
    - label: §aFreies Plot finden
      icon: compass
      enabled: true
      command:
      - auto
      plot-context: true
      fields:
      - label: Breite in Plots
        default: '1'
      - label: Länge in Plots
        default: '1'
    - label: §aDieses Plot beanspruchen
      icon: grass
      enabled: true
      command:
      - claim
      plot-context: true
    - label: §bMein Zuhause
      icon: bed
      enabled: true
      command:
      - home
      plot-context: false
      fields:
      - label: Plotnummer
        default: '1'
    - label: §bPlot besuchen
      icon: ender_pearl
      enabled: true
      command:
      - visit
      plot-context: false
      fields:
      - label: Spieler, Alias oder X;Z
        default: ''
      - label: Treffer-Nummer
        default: '1'
    - label: §fPlotinformationen
      icon: book
      enabled: true
      command:
      - info
      plot-context: true
    - label: §bZur Mitte
      icon: compass
      enabled: true
      command:
      - middle
      plot-context: true
    - label: §ePlots auflisten
      icon: paper
      enabled: true
      command:
      - list
      plot-context: false
      fields:
      - label: Filter
        default: ''
        options:
        - mine
        - shared
        - world
        - all
        - forsale
        - top
        - done
      - label: Seite
        default: '1'
    - label: §ePlots eines Spielers
      icon: paper
      enabled: true
      command:
      - list
      - player
      plot-context: false
      fields:
      - label: Spielername
        default: ''
      - label: Seite
        default: '1'
    - label: §eAlias suchen
      icon: paper
      enabled: true
      command:
      - list
      - fuzzy
      plot-context: false
      fields:
      - label: Suchtext
        default: ''
      - label: Seite
        default: '1'
    - label: §eFreie IDs anzeigen
      icon: paper
      enabled: true
      command:
      - list
      - unowned
      plot-context: true
    - label: §fAls Befehlsziel wählen
      icon: paper
      enabled: true
      command:
      - target
      plot-context: true
    - label: §7Befehlsziel aufheben
      icon: paper
      enabled: true
      command:
      - target
      - 'off'
      plot-context: false
  members:
    title: §b§lBetterPlots §r§8· Mitglieder
    description: Wähle eine Aktion. Änderungen prüfen immer deine Grundstücksrechte.
