      plot-context: true
    - label: §eWeiterbauen
      icon: diamond_pickaxe
      enabled: true
      command:
      - continue
      plot-context: true
  build:
    title: §b§lBetterPlots §r§8· Einfach gestalten
    description: Wähle eine Aktion. Änderungen prüfen immer deine Grundstücksrechte.
    entries:
    - label: §aPlots verbinden
      icon: chain
      enabled: true
      command:
      - merge
      plot-context: true
      fields:
      - label: Richtung
        default: ''
        options:
        - Alle Seiten
        - Norden
        - Osten
        - Süden
        - Westen
        values:
        - all
        - n
        - e
        - s
        - w
    - label: §ePlots trennen
      icon: shears
      enabled: true
      command:
      - unlink
      plot-context: true
    - label: §bRand gestalten
      icon: stone_slab
      enabled: true
      command:
      - set
      - border
      plot-context: true
      fields:
      - label: Material
        default: ''
        options:
        - Steinziegel
        - Glatter Stein
        - Bruchstein
        - Eichenholz
        - Sandstein
        values:
        - stone_bricks
        - smooth_stone
        - cobblestone
        - oak_planks
        - sandstone
    - label: §bWand gestalten
      icon: stone_bricks
      enabled: true
      command:
      - set
      - wall
      plot-context: true
      fields:
      - label: Material
        default: ''
        options:
        - Steinziegel
        - Glatter Stein
        - Bruchstein
        - Eichenholz
        - Sandstein
        values:
        - stone_bricks
        - smooth_stone
        - cobblestone
        - oak_planks
        - sandstone
    - label: §eBebauung leeren
      icon: iron_shovel
      enabled: true
      command:
      - set
      - air
      plot-context: true
      hint: Entfernt Blöcke oberhalb der Bodenhöhe, einschließlich Rand.
    - label: §aUntergrund wiederherstellen
      icon: grass
      enabled: true
      command:
      - set
      - refill
      plot-context: true
      hint: Setzt Boden und Untergrund zurück. Bauten darüber bleiben erhalten.
    - label: §cGanzes Plot zurücksetzen
      icon: barrier
      enabled: true
      command:
      - clear
      plot-context: true
      hint: Löscht auch Gebäude und Keller; stellt den ursprünglichen Zustand her.
    - label: §6Wege rund ums Plot gestalten
      icon: oak_planks
      enabled: true
      command:
      - road
      plot-context: true
      fields:
      - label: Wegmaterial
        default: ''
        options:
        - Eichenholz
        - Glatter Stein
        - Kies
        - Steinziegel
        values:
        - oak_planks
        - smooth_stone
        - gravel
        - stone_bricks
      hint: Adminfunktion. Nur äußere Straßenoberfläche; keine gemergten Innenflächen.
  backups:
    title: §l§bBauwerke & Schematics
    description: '§f1. Speichern  §7→  §f2. Bauwerk auswählen  §7→  §f3. Einsetzen

